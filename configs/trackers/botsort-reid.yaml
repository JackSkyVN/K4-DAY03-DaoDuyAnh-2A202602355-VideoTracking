# Day 3 treatment: BoT-SORT with appearance-assisted association.
# Keep detector inputs fixed against ByteTrack; this file changes association only.
tracker_type: botsort
track_high_thresh: 0.25
track_low_thresh: 0.10
new_track_thresh: 0.25
track_buffer: 30
match_thresh: 0.80
fuse_score: true

# The lab camera is fixed. Avoid mixing camera-motion compensation into the
# ReID lesson; the treatment is appearance-assisted association.
gmc_method: none

# ReID is gated by both spatial proximity and visual similarity. `auto` uses
# compatible YOLO features or the pinned Ultralytics fallback encoder.
proximity_thresh: 0.50
appearance_thresh: 0.80
with_reid: true
model: auto
